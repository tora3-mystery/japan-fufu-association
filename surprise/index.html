}
function refreshButtons(){nodes.forEach(n=>{n.button.className='stop';if(n.state==='locked'){n.button.disabled=true;n.button.classList.add('done');n.button.textContent='✓';}else if(active&&n.state==='spinning'){n.button.disabled=false;n.button.classList.add('ready');n.button.textContent='STOP';}else{n.button.disabled=true;n.button.textContent='STOP'}})}
function reset(){clearTimeout(finalTimer);finalTimer=0;stopPartyMusic();cancelAnimationFrame(raf);raf=0;lastTime=0;secretTaps=0;stage.classList.remove('party-mode');partyReveal.setAttribute('aria-hidden','true');resultLabel.textContent='HELLO, WORLD!';resultName.textContent='伊藤 新之介';resultEn.textContent='SHINNOSUKE ITO';start.classList.remove('during');start.disabled=false;start.textContent='▶ START';result.classList.remove('shown');result.setAttribute('aria-hidden','true');announcement.textContent='';nodes.forEach(n=>{n.phase=0;n.state='idle';n.goal=0;n.lastBase=NaN;n.el.classList.remove('locked');render(n,true)});active=false;refreshButtons();if(confettiFrame)cancelAnimationFrame(confettiFrame);confettiFrame=0;ctx.clearRect(0,0,innerWidth,innerHeight)}
function loop(now){if(!active)return;const dt=lastTime?Math.min((now-lastTime)/1000,.05):0;lastTime=now;
 for(let i=0;i<nodes.length;i++){const n=nodes[i];if(n.state==='spinning')n.phase+=dt*(10.5+i*1.3);else if(n.state==='stopping'){const x=Math.min(1,(now-n.stopStart)/n.stopDuration),ease=1-Math.pow(1-x,3);n.phase=n.from+(n.goal-n.from)*ease;if(x>=1){n.phase=n.goal;n.state='locked';n.el.classList.add('locked');playStop(i);announcement.textContent=NAME[i]+' が止まりました。';refreshButtons()}}render(n)}
 if(nodes.every(n=>n.state==='locked')){finish();return}
 raf=requestAnimationFrame(loop)}
function startSpin(){if(active)return;reset();active=true;getAudio();playStart();nodes.forEach((n,i)=>{n.state='spinning';n.phase=.5+i*1.1;n.lastBase=NaN;render(n,true)});start.textContent='発表中';start.disabled=false;start.classList.add('during');refreshButtons();raf=requestAnimationFrame(loop)}
function stop(i){const n=nodes[i];if(!active||n.state!=='spinning')return;n.state='stopping';n.from=n.phase;n.goal=Math.ceil(n.from)+5;n.stopStart=performance.now();n.stopDuration=reduced.matches?80:1160;n.lastBase=NaN;refreshButtons();render(n,true)}
function finish(){active=false;cancelAnimationFrame(raf);raf=0;nodes.forEach(n=>render(n,true));refreshButtons();start.disabled=true;start.classList.remove('during');finalTimer=setTimeout(()=>{result.classList.add('shown');result.setAttribute('aria-hidden','false');announcement.textContent='お名前は、伊藤 新之介（いとう しんのすけ）です。';fanfare();confetti();start.textContent='↻ もう一度';start.disabled=false;finalTimer=0},reduced.matches?0:400)}
function party(){
 if(!active)return;active=false;cancelAnimationFrame(raf);raf=0;lastTime=0;
 nodes.forEach(n=>{if(n.state==='spinning'||n.state==='stopping')n.state='idle'});refreshButtons();
 stage.classList.add('party-mode');partyReveal.setAttribute('aria-hidden','false');
 resultLabel.textContent='SURPRISE!';resultName.textContent='伊藤 ぱーてぃーちゃん';resultEn.textContent='PARTY TIME!';
 result.classList.add('shown');result.setAttribute('aria-hidden','false');
 announcement.textContent='祭、男！お名前は、伊藤 ぱーてぃーちゃん！';
 start.classList.remove('during');start.textContent='↻ もう一度';start.disabled=false;
 confetti(true);startPartyMusic();
}
start.addEventListener('click',()=>{if(active){secretTaps++;if(secretTaps===3)party();}else if(!finalTimer){startSpin()}});nodes.forEach((n,i)=>n.button.addEventListener('click',()=>stop(i)));
sound.addEventListener('click',()=>{soundEnabled=!soundEnabled;sound.setAttribute('aria-pressed',String(soundEnabled));sound.textContent=soundEnabled?'♪ 音あり':'♪ 消音中';if(!soundEnabled)stopPartyMusic();else if(stage.classList.contains('party-mode'))startPartyMusic();else tone(660,.14,.05)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){lastTime=0;if(audioContext&&audioContext.state==='running')audioContext.suspend()}else if(soundEnabled&&(active||stage.classList.contains('party-mode'))&&audioContext)audioContext.resume()});reset();
})();
</script>
</body>
